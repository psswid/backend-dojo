# Backend Dojo — fully Dockerized Laravel platform
# Usage: docker compose up -d && docker compose exec app php artisan migrate --seed
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend-dojo/app
    container_name: backend-dojo-app
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dojo

  web:
    image: nginx:alpine
    container_name: backend-dojo-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8180}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dojo

  queue:
    image: backend-dojo/app
    container_name: backend-dojo-queue
    user: "1000:1000"
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dojo

  scheduler:
    image: backend-dojo/app
    container_name: backend-dojo-scheduler
    user: "1000:1000"
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dojo

  mysql:
    image: mysql:8.4
    container_name: backend-dojo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-backend_dojo}
      MYSQL_USER: ${DB_USERNAME:-dojo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - dojo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dojo

  redis:
    image: redis:7-alpine
    container_name: backend-dojo-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - dojo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dojo

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: backend-dojo-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-dojo-master-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${FORWARD_MEILI_PORT:-7700}:7700"
    volumes:
      - dojo_meili:/meili_data
    networks:
      - dojo

  # Isolated PHP code runner for coding tasks (snippet/debug).
  # Read-only FS, non-root, no DB/network creds, memory+CPU capped, tmpfs /tmp.
  runner:
    image: php:8.4-cli-alpine
    container_name: backend-dojo-runner
    user: "1000:1000"
    restart: unless-stopped
    working_dir: /runner
    command: ["php", "-S", "0.0.0.0:8080", "runner.php"]
    volumes:
      - ./docker/runner:/runner:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    networks:
      - dojo

networks:
  dojo:
    driver: bridge
    ipam:
      config:
        # NOTE: pinned inside 172.16.0.0/12 (NordVPN firewall allowlist) and
        # outside Docker's default 172.17–172.31 auto-allocation range.
        - subnet: 172.16.100.0/24

volumes:
  dojo_mysql:
  dojo_redis:
  dojo_meili:
